<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Denied &middot; Smart IT Help Desk</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="card-panel text-center p-5" style="max-width: 520px;">
    <div class="empty-icon"><i class="bi bi-shield-lock"></i></div>
    <h4 class="mb-2">Access denied</h4>
    <p class="text-muted mb-4">You do not have permission to open this page. It belongs to a different user role.</p>
    <div class="d-flex gap-2 justify-content-center">
      {% if g.user %}
      <a href="{{ url_for(dashboard_endpoint) }}" class="btn btn-primary">Back to my dashboard</a>
      {% else %}
      <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Go to login</a>
      {% endif %}
    </div>
  </div>
</body>
</html>
